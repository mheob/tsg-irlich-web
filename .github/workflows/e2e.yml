name: E2E

on:
  pull_request:
  push:
    branches: [next]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # The visual regression baselines are pixel-comparable only against the image that produced
    # them, so the whole suite runs inside the pinned Playwright container — the same one
    # `apps/web/scripts/update-screenshots.sh` uses locally. The tag has to be bumped together with
    # `@playwright/test` and with the image name in that script.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # `pwuser` — the image's unprivileged account, and the UID the workspace belongs to. As root,
      # Chromium refuses to start with its sandbox enabled.
      options: --user 1001 --ipc=host
    # The image ships its browsers under `/ms-playwright` and says so through its own `ENV`, but a
    # container job's steps do not inherit that — Playwright would look in `$HOME/.cache` and find
    # nothing. Naming it here is what makes the preinstalled browsers reachable, and why this job
    # needs no install step.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Nothing here pushes, so the job never needs the token in `.git/config`.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The suite builds the app, and the build type-checks it — which needs the types Next.js
      # generates and does not check in.
      - name: Generate Route Types
        run: pnpm run typegen:routes
        env:
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}

      # Every outbound request is served by the mocks in `apps/web/e2e/mocks/preload.ts`, so this
      # job needs no secret of any kind — `apps/web/.env.e2e` carries the dummy values.
      - name: Run E2E Tests
        run: pnpm run test:e2e

      # `test-results` carries the actual/expected/diff triple of every failed screenshot
      # comparison, which is the only way to judge a visual diff from the outside.
      - name: Upload Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
