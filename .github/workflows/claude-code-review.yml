name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      # A bot may open a pull request that is worth reviewing — Renovate does, every Thursday. A bot
      # `synchronize` is something else: kodiak rebasing the branch just before it merges, or
      # Renovate refreshing its own. The review already ran when the pull request was opened, so
      # skip those instead of posting a second identical comment.
      #
      # The condition sits on the step, not on the job: `claude-review` is a required status check
      # on `next`, and a job that runs and skips its work still reports success, while a skipped
      # job is a bet on how branch protection reads that state.
      - name: Run Claude Code Review
        id: claude-review
        if: github.event.sender.type != 'Bot' || github.event.action != 'synchronize'
        uses: anthropics/claude-code-action@a60f3e1db3edbceed2b1e6c6a9d34c36b8a15eba # v1.0.209
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this the action refuses every bot actor, which is why all 17 Renovate runs and
          # both kodiak runs failed. The action lowercases and strips a trailing `[bot]` on both
          # sides before comparing, so either spelling matches; the suffixed form is what the
          # action's own documentation asks for.
          allowed_bots: "kodiakhq[bot],renovate[bot]"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
