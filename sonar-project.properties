sonar.projectKey=mheob_tsg-irlich-web
sonar.organization=mheob

# Coverage settings
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/studio/coverage/lcov.info,packages/shared/coverage/lcov.info,packages/email/coverage/lcov.info
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.coverage.exclusions=**/*.config.ts,**/test-utils/**,**/*.generated.ts,apps/web/e2e/**

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=tsg-irlich-web
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Exclude generated types from SonarCloud
sonar.exclusions=**/sanity.types.generated.ts
