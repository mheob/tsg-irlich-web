sonar.projectKey=mheob_tsg-irlich-web
sonar.organization=mheob

# Coverage settings
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/studio/coverage/lcov.info,packages/shared/coverage/lcov.info,packages/email/coverage/lcov.info,packages/pdf-pages/coverage/lcov.info
# `test-utils` holds fakes and render helpers that only tests import, so it counts as test code
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/test-utils/**
sonar.coverage.exclusions=**/*.config.ts,**/test-utils/**,**/*.generated.ts,apps/web/e2e/**,**/lighthouserc.cjs

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=tsg-irlich-web
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Exclude generated types from SonarCloud
sonar.exclusions=**/sanity.types.generated.ts

# Rules that do not fit this codebase. Each is limited to the files where it misfires, unless it
# contradicts one of our lint rules everywhere.
# AGENTS.md ("SonarQube Cloud") explains every entry; keep both in step.
sonar.issue.ignore.multicriteria=tailwindScope,tailwindDeclaration,emailTable,emailRole,scriptAwaitLoop,asyncWithoutAwait

# Tailwind v4's `@utility` directive is unknown to the CSS analyzer, so the nesting and the
# declarations inside each utility look invalid to it
sonar.issue.ignore.multicriteria.tailwindScope.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.tailwindScope.resourceKey=apps/web/src/app/globals.css
sonar.issue.ignore.multicriteria.tailwindDeclaration.ruleKey=css:S8767
sonar.issue.ignore.multicriteria.tailwindDeclaration.resourceKey=apps/web/src/app/globals.css

# HTML emails lay out with `<table role="presentation">`, because mail clients ignore CSS layout
sonar.issue.ignore.multicriteria.emailTable.ruleKey=typescript:S5257
sonar.issue.ignore.multicriteria.emailTable.resourceKey=packages/email/**
sonar.issue.ignore.multicriteria.emailRole.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.emailRole.resourceKey=packages/email/**

# Import and migration scripts work one item after another on purpose; every such loop carries an
# `oxlint-disable-next-line no-await-in-loop` with its reason, which Sonar does not read
sonar.issue.ignore.multicriteria.scriptAwaitLoop.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.scriptAwaitLoop.resourceKey=apps/studio/scripts/**

# oxlint's `typescript/promise-function-async` wants every function that returns a promise to be
# `async`, so `async () => client.fetch(…)` is the house style that this Sonar rule rejects
sonar.issue.ignore.multicriteria.asyncWithoutAwait.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.asyncWithoutAwait.resourceKey=**/*
