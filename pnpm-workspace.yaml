packages:
  - apps/*
  - packages/*

# esbuild (platform binary) and lefthook (git hook binary) are unusable without their install
# scripts. msw only copies its browser service worker into a public directory, which the
# end-to-end mocks never use — they run in the Node.js server process.
allowBuilds:
  esbuild: true
  lefthook: true
  msw: false

# Fold compatible versions of a dependency onto one while installing, so the lock file no longer
# needs a separate `pnpm dedupe`. Frozen installs (CI) leave the lock file as it is
autoDedupe: true

# `pnpm add` (and `vp add`) always goes through the default catalog: a new dependency lands there
# and the manifest references it with `catalog:`, and a version outside an existing entry's range
# is refused
catalogMode: strict

# Exclude trusted packages from the age gate
minimumReleaseAgeExclude:
  - "@mheob/*"

overrides:
  # puppeteer-core (through lighthouse, through @lhci/cli) pins @puppeteer/browsers 2.x, whose
  # extract-zip 2.0.1 has no fixed release (GHSA-jmr9-qjv8-65gv). 3.x dropped extract-zip for
  # modern-tar. Only the browser downloader lives behind it, and Lighthouse CI never runs it —
  # both CI and the local path point at a Chrome that is already installed
  "@puppeteer/browsers": "^3.2.1"
  # @module-federation/dts-plugin (through the Sanity CLI's workbench) pins adm-zip 0.6.0, which
  # allocates whatever uncompressed size an archive declares (GHSA-7q85-xj36-vmfc); 0.6.1 fixes it
  adm-zip: "^0.6.1"
  # get-uri (through proxy-agent, through @lhci/cli) pins basic-ftp ^5, whose directory-listing
  # parser backtracks quadratically (GHSA-c475-qrg2-pj4r). Only 6.2.1 fixes it; 6.0's one breaking
  # change turns off separate transfer hosts by default, and Lighthouse CI never fetches over FTP
  basic-ftp: "^6.2.1"
  # cve-lite-cli pins better-sqlite3 12, whose install script runs the unmaintained
  # prebuild-install and prints Node's DEP0176 deprecation on every install. 13.x ships the
  # prebuilt bindings inside the package, so nothing is built at install time any more
  better-sqlite3: "^13.0.3"
  # react-email → conf → ajv pulls fast-uri 3.1.5, vulnerable to improper hex-encoding
  # handling in URL normalization (CVE-2026-76172); 3.1.6 fixes it and stays in ajv's ^3 range
  fast-uri: "^3.1.6"
  js-yaml: ">=4.3.1"
  # @react-email/ui pins next 16.3.0, whose image optimizer hands AVIF content to
  # sharp/libheif and allows code execution in the optimization process
  # (SNYK-JS-NEXT-19269945); fixed in 16.3.3. 16.3.8 also closes an SSRF (CVE-2026-94483)
  next: "^16.3.8"
  # @tailwindcss/typography pins 6.0.10, which is vulnerable to uncontrolled recursion
  # in `toString()` (CVE-2026-9358); fixed in 6.1.3
  postcss-selector-parser: "^6.1.3"
  # @puppeteer/browsers 3.x wants a proxy-agent that @lhci/cli and puppeteer-core still pin to
  # 6.5.0. 8.x is the same `ProxyAgent` surface and only carries the proxy support behind a
  # browser download and an `lhci upload` — neither of which this repo's Lighthouse run does
  proxy-agent: "^8.0.2"
  smol-toml: ">=1.6.1"
  # @lhci/cli pulls tmp 0.0.33 (through inquirer → external-editor) and 0.1.0, both of which
  # write through a symlinked path parameter (GHSA-52f5-9888-hmc6, GHSA-ph9p-34f9-6g65); 0.2.6
  # fixes both and keeps the `fileSync`/`dirSync` API the two call sites use
  tmp: "^0.2.6"
  # Bounded to v7: jsdom (via the Sanity CLI) deep-imports undici v7 internals that v8 removed
  undici: "^7.29.0"
  uuid: ">=11.1.1"
  vite@*: "catalog:"
  vitest@*: "catalog:"

# Every external dependency resolves through this default catalog (see `catalogMode` above);
# manifests reference it with `catalog:`. Only workspace packages stay on `workspace:*`.
catalog:
  # Vite+ toolchain: `vp migrate` re-pins these to the release it runs, keep them together
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  "@vitest/coverage-v8": 5.0.1

  # Repository tooling: TypeScript, lint and format presets, commits, hooks, tasks and audits
  "@commitlint/cli": ^21.2.3
  "@mheob/commitlint-config": ^2.0.8
  "@mheob/oxfmt-config": ^1.3.3
  "@mheob/oxlint-config": ^4.1.0
  "@mheob/tsconfig": ^3.0.2
  "@types/node": ^24.19.1
  cve-lite-cli: ^1.37.0
  czg: ^1.14.0
  eslint-plugin-better-tailwindcss: ^4.7.0
  lefthook: ^2.1.16
  turbo: ^2.11.7
  typescript: ^7.0.2

  # React
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  react: ^19.3.0
  react-dom: ^19.3.0

  # Next.js app
  "@base-ui/react": ^1.8.0
  "@hookform/resolvers": ^5.9.1
  "@icons-pack/react-simple-icons": ^13.15.1
  "@vercel/analytics": ^2.0.1
  "@vercel/speed-insights": ^2.0.0
  class-variance-authority: ^0.7.1
  lucide-react: ^1.51.0
  motion: ^14.0.0
  next: ^16.3.8
  next-safe-action: ^8.7.3
  react-hook-form: ^7.89.0
  resend: ^6.32.0
  schema-dts: ^2.1.0
  server-only: ^0.0.1
  zod: ^4.6.5

  # Styling
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/typography": ^0.5.20
  clsx: ^2.1.1
  postcss: ^8.5.28
  postcss-load-config: ^6.0.1
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3

  # Sanity: the Studio, its plugins and the clients of the web app
  "@sanity/assist": ^6.2.2
  "@sanity/client": ^8.9.0
  "@sanity/icons": ^5.2.3
  "@sanity/image-url": ^2.1.1
  "@sanity/locale-de-de": ^1.1.37
  "@sanity/ui": ^4.3.0
  "@sanity/vision": ^6.17.0
  next-sanity: ^13.3.4
  react-icons: ^5.7.0
  sanity: ^6.17.0
  sanity-plugin-media: ^6.3.2
  slugify: ^1.6.9
  styled-components: ^6.5.3

  # E-mail templates
  "@react-email/render": ^2.1.0
  "@react-email/ui": ^6.11.0
  react-email: ^6.11.0

  # Tests: Vitest environment and plugins, end-to-end, accessibility and Lighthouse
  "@axe-core/playwright": ^4.13.0
  "@lhci/cli": ^0.15.1
  "@playwright/test": ^1.63.0
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  "@vitejs/plugin-react": ^6.1.1
  # Held below 30.1 by `.github/renovate.json` until vitest-dev/vitest#11336 is fixed (WEB-318)
  jsdom: ~30.0.1
  msw: ^3.0.2

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    # An optional peer that only Vitest's browser mode loads, which no workspace uses. The
    # end-to-end mocks run msw 3, and @vitest/mocker 5.0 still names ^2.4.9
    "@vitest/mocker>msw": "3"
    vite: "*"
    vitest: "*"
